apiVersion: merci.dev/v1alpha1
kind: Agent
metadata:
  name: env-map
  description: A definition that writes env values instead of keys.
spec:
  instructions: Do nothing.
  tools:
    definitions:
      - name: echo_args
        description: Echoes the arguments back.
        script: scripts/echo.mjs
        env:
          CI: true
        parameters:
          type: object
