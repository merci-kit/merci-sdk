apiVersion: merci.dev/v1alpha1
kind: Agent

metadata:
  name: reviewer
  description: Reviews diffs for correctness and missing tests.

spec:
  model: default
  instructions: |
    You review changes for correctness and regressions.
    Do not modify files.

  tools:
    use: [files, web, todos]
    allow: ["mcp:github/issues_*"]
    deny: ["native:execute_shell_command"]
    mode: default
    definitions:
      - name: echo_args
        description: Echoes the arguments back.
        script: scripts/echo-args.mjs
        timeoutMs: 5000
        env: [CI]
        parameters:
          type: object
          properties:
            paths:
              type: array
              items: { type: string }
          required: [paths]
          additionalProperties: false

  limits:
    maxIterations: 8
    maxDepth: 0
    timeoutMs: 120000
    maxElapsedMs: 300000
